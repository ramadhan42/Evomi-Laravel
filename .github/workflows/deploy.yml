name: Deploy evomi.shop + evomi.id

# Alur deploy:
#   1. Build aset di CI, commit balik bila berubah - server tidak menjalankan
#      Node, jadi hasil build harus sudah ada di repo saat server menariknya.
#   2. Jalankan deploy/ssh-deploy.sh di server lewat SSH, sekali per domain.
#      Server menarik sendiri rilisnya dari GitHub, menyalin kode/gambar/aset,
#      mengonversi unggahan ke WebP, migrasi, lalu cache.
#
# Dulu langkah 2 mengunggah satu berkas PHP ke docroot lewat FTP lalu
# memanggilnya lewat HTTP. Cara itu ditinggalkan: unggahan FTP-nya timeout
# sesekali (run #14 dan #16 gagal setelah menggantung ~134 detik, sementara run
# yang sehat selesai dalam 3 detik), dan setiap kegagalan melewatkan deploy
# kedua domain. Lewat SSH tidak ada berkas yang menginap di docroot, tidak ada
# endpoint deploy yang sempat menganggur, dan keluarannya langsung terbaca di
# log Actions. evomi-deploy.php sengaja ditinggal di repo sebagai jalur
# cadangan bila suatu saat SSH tidak tersedia.
#
# Secret yang harus diisi di Settings > Secrets and variables > Actions:
#   SSH_HOST         alamat server (mis. 145.79.14.242)
#   SSH_USER         user SSH hosting (mis. u160994497)
#   SSH_PRIVATE_KEY  private key OpenSSH untuk deploy (tanpa passphrase);
#                    public key-nya sudah terpasang di ~/.ssh/authorized_keys
#
# Variabel opsional (tab Variables):
#   SSH_PORT         default: 65002 (port SSH Hostinger)
#   SITE_URL         default: https://evomi.shop
#   SECOND_SITE      default: evomi.id  (kosongkan untuk mematikan)
#   SECOND_SITE_URL  default: https://evomi.id
#
# Dua hal yang menentukan kapan workflow ini benar-benar jalan:
#
#   1. paths-ignore membuat push yang tidak mengubah berkas apa pun ikut
#      dilewati - termasuk commit kosong. Jadi `git commit --allow-empty`
#      TIDAK bisa dipakai untuk memicu deploy ulang.
#
#   2. workflow_dispatch (tombol "Run workflow" di tab Actions) hanya muncul
#      bila berkas workflow ada di branch default. Selama deploy.yml cuma ada
#      di branch ini dan belum di main, tombol itu tidak akan tampil.
on:
  push:
    branches:
      - perf/webp-and-bundle-split
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  # Menyerialkan deploy untuk KEDUA domain: satu run menyentuh dua docroot di
  # akun yang sama, jadi dua run bersamaan bisa saling menimpa di tengah jalan.
  group: deploy-evomi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SSH_PORT: ${{ vars.SSH_PORT || '65002' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://evomi.shop' }}
      FIRST_SITE: ${{ vars.FIRST_SITE || 'evomi.shop' }}
      SECOND_SITE: ${{ vars.SECOND_SITE || 'evomi.id' }}
      SECOND_SITE_URL: ${{ vars.SECOND_SITE_URL || 'https://evomi.id' }}
      SCRIPT: deploy/ssh-deploy.sh

    steps:
      - name: Ambil kode
        uses: actions/checkout@v7
        with:
          # Perlu token yang bisa push, karena hasil build di-commit balik.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Siapkan Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Build aset
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Commit hasil build bila berubah
        run: |
          if git diff --quiet -- public/build; then
            echo "aset build tidak berubah"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/build

          # [skip ci] mencegah commit ini memicu workflow lagi.
          git commit -m "Build assets for deploy [skip ci]"
          git push

          echo "aset build diperbarui dan didorong ke repo"

      # Server menarik rilis dari GitHub berdasarkan sha. Kalau langkah di atas
      # membuat commit baru, sha itulah yang harus dipakai - bukan sha yang
      # memicu workflow, yang belum berisi aset hasil build.
      - name: Tentukan sha rilis
        run: |
          sha=$(git rev-parse HEAD)
          echo "RELEASE_SHA=$sha" >> "$GITHUB_ENV"
          echo "rilis yang akan dipasang: $sha"

      # Memastikan ketiga secret terbaca SEBELUM menyentuh server. Nilainya
      # tidak pernah dicetak; yang dilaporkan hanya namanya.
      - name: Pastikan secret deploy tersedia
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          kurang=""
          for nama in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            [ -z "${!nama:-}" ] && kurang="${kurang}${nama} "
          done

          if [ -n "$kurang" ]; then
            echo "::error::Secret belum terbaca di ${GITHUB_REPOSITORY}: ${kurang}- isi di Settings > Secrets and variables > Actions, bagian Repository secrets (bukan tab Variables, bukan Environment secrets)"
            exit 1
          fi

          echo "ketiga secret terbaca"

      - name: Siapkan kunci SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Kunci yang tersalin sebagian (baris BEGIN/END hilang, atau ada
          # spasi ikut terbawa) gagal jauh di belakang dengan pesan libcrypto
          # yang membingungkan. Diperiksa di sini, dan sidik jarinya dicetak
          # supaya bisa dicocokkan dengan yang terdaftar di server - sidik jari
          # bukan rahasia.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/tmp/keyerr; then
            echo "::error::SSH_PRIVATE_KEY tidak terbaca sebagai kunci OpenSSH: $(tail -1 /tmp/keyerr)"
            echo "::error::Salin ulang SELURUH isi berkas kunci, termasuk baris -----BEGIN dan -----END"
            exit 1
          fi

          echo "sidik jari kunci: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"

          # Host key diambil sekali di sini, jadi ssh tidak perlu ditawari
          # StrictHostKeyChecking=no yang menerima host mana pun.
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/tmp/scanerr || true

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan tidak mendapat host key dari $SSH_HOST:$SSH_PORT - $(tail -2 /tmp/scanerr)"
            exit 1
          fi

          echo "host key terbaca: $(wc -l < ~/.ssh/known_hosts) baris"

      - name: Kirim script deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          if [ ! -f "$SCRIPT" ]; then
            echo "::error::$SCRIPT tidak ada di repo"
            exit 1
          fi

          # -v dipakai supaya alasan penolakan (kunci ditolak, host key salah,
          # atau user keliru) terbaca langsung di log, bukan sekadar "exit 1".
          # Tujuan ditulis tanpa "~/" karena sebagian server menolak tilde di
          # sisi scp protokol lama.
          if ! scp -v -P "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes -o IdentitiesOnly=yes \
                   "$SCRIPT" "$SSH_USER@$SSH_HOST:ssh-deploy.sh" 2>/tmp/scperr; then
            echo "--- alasan penolakan ---"
            grep -Ei 'permission denied|host key|libcrypto|invalid format|no such file|refused|timed out|denied|error' /tmp/scperr | tail -12
            echo "------------------------"
            echo "::error::scp gagal - lihat alasan di atas"
            exit 1
          fi

          echo "$SCRIPT terkirim"

      - name: Jalankan deploy di server
        id: run
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" \
              "DEPLOY_REPO='$GITHUB_REPOSITORY' bash ~/ssh-deploy.sh '$RELEASE_SHA' '$FIRST_SITE'"

      - name: Jalankan deploy di server (domain kedua)
        id: run_second
        if: steps.run.outcome == 'success' && env.SECOND_SITE != ''
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key -o BatchMode=yes \
              "$SSH_USER@$SSH_HOST" \
              "DEPLOY_REPO='$GITHUB_REPOSITORY' bash ~/ssh-deploy.sh '$RELEASE_SHA' '$SECOND_SITE'"

      - name: Bersihkan kunci
        if: always()
        run: rm -f ~/.ssh/deploy_key

      - name: Periksa hasil di situs
        if: steps.run.outcome == 'success'
        run: |
          set -uo pipefail

          # grep -c menghitung BARIS, sedangkan HTML di sini praktis satu baris
          # panjang - jadi kemunculan dihitung lewat grep -o | wc -l.
          #
          # `|| true` bukan hiasan: grep keluar dengan status 1 kalau tidak
          # menemukan apa pun, dan pipefail meneruskan status itu. Padahal di
          # sini NOL kemunculan justru hasil yang benar - ikon keranjang memang
          # sudah dihapus. Karena runner menjalankan skrip ini dengan `bash -e`,
          # tanpa penetral itu langkah verifikasi berhenti gagal tepat ketika
          # situsnya sudah sesuai harapan.
          count() { printf '%s' "$1" | grep -o "$2" | wc -l | tr -d ' ' || true; }

          periksa() {
            nama="$1"
            url="$2"

            home=$(curl --silent --max-time 30 "$url/")
            detail=$(curl --silent --max-time 30 "$url/belanja/1")

            # head menutup pipa setelah baris pertama, jadi grep bisa kena
            # SIGPIPE dan statusnya ikut menggagalkan langkah ini.
            js=$(printf '%s' "$home" | grep -oE '/build/assets/app-[A-Za-z0-9_-]+\.js' | head -1 || true)
            webp=$(count "$home" '\.webp')
            png=$(count "$home" '\.png')
            mp=$(count "$detail" 'evomi-mp__btn')
            cart=$(count "$home" 'nav-cart-btn')

            {
              echo "### Hasil di $nama"
              echo ""
              echo "| Indikator | Nilai |"
              echo "| --- | --- |"
              echo "| Bundle JS | \`${js:-tidak terbaca}\` |"
              echo "| Rujukan .webp di beranda | $webp |"
              echo "| Rujukan .png di beranda | $png |"
              echo "| Tombol marketplace di /belanja/1 | $mp |"
              echo "| Ikon keranjang di navbar | $cart |"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"

            if [ "$mp" -lt 1 ] || [ "$cart" -ne 0 ]; then
              echo "::warning::$nama belum menampilkan perubahan yang diharapkan"
            fi
          }

          periksa "$SITE_URL" "$SITE_URL"

          # Domain kedua hanya diperiksa bila langkah deploy-nya benar-benar jalan.
          if [ "${{ steps.run_second.outcome }}" = "success" ]; then
            periksa "$SECOND_SITE_URL" "$SECOND_SITE_URL"
          fi
